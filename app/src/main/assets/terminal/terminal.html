<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <title>Rostrum Terminal</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    html,
    body,
    #terminal {
      width: 100%;
      height: 100vh;
      min-height: 220px;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      touch-action: manipulation;
    }

    #terminal .xterm {
      height: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 2;
      color: #94a3b8;
      font: 13px/1.4 monospace;
      pointer-events: none;
      user-select: none;
    }

    #status.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="terminal" tabindex="0"></div>
  <div id="status">Terminal starting...</div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script>
    (function () {
      'use strict';

      var TerminalCtor = window.Terminal;
      var FitAddonCtor = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);
      var bridge = window.RostrumTerminal || null;
      var terminalElement = document.getElementById('terminal');
      var statusElement = document.getElementById('status');
      var terminal = new TerminalCtor({
        allowProposedApi: false,
        convertEol: false,
        cursorBlink: true,
        cursorStyle: 'block',
        fontFamily: 'monospace',
        fontSize: 13,
        scrollback: 5000,
        theme: {
          background: '#000000',
          foreground: '#d4d4d4',
          cursor: '#f8fafc',
          black: '#000000',
          red: '#ef4444',
          green: '#22c55e',
          yellow: '#eab308',
          blue: '#3b82f6',
          magenta: '#a855f7',
          cyan: '#06b6d4',
          white: '#e5e7eb',
          brightBlack: '#64748b',
          brightRed: '#f87171',
          brightGreen: '#4ade80',
          brightYellow: '#facc15',
          brightBlue: '#60a5fa',
          brightMagenta: '#c084fc',
          brightCyan: '#22d3ee',
          brightWhite: '#ffffff'
        }
      });
      var fitAddon = FitAddonCtor ? new FitAddonCtor() : null;
      var lastColumns = 0;
      var lastRows = 0;
      var resizeFrame = 0;
      var minimumColumns = 20;
      var minimumRows = 8;

      function callBridge(name) {
        if (!bridge || typeof bridge[name] !== 'function') return;
        var args = Array.prototype.slice.call(arguments, 1);
        bridge[name].apply(bridge, args);
      }

      function resizeBridge() {
        if (terminal.cols === lastColumns && terminal.rows === lastRows) return;
        lastColumns = terminal.cols;
        lastRows = terminal.rows;
        callBridge('resize', terminal.cols, terminal.rows);
      }

      function fit() {
        if (fitAddon) {
          fitAddon.fit();
        }
        if (terminal.cols < minimumColumns || terminal.rows < minimumRows) {
          terminal.resize(
            Math.max(terminal.cols, minimumColumns),
            Math.max(terminal.rows, minimumRows)
          );
        }
        resizeBridge();
        console.debug('xterm.fit ' + terminal.cols + 'x' + terminal.rows);
      }

      function scheduleFit() {
        if (resizeFrame) return;
        resizeFrame = window.requestAnimationFrame(function () {
          resizeFrame = 0;
          fit();
        });
      }

      function decodeBase64(base64Data) {
        var binary = atob(base64Data);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function decodeBase64Text(base64Data) {
        var bytes = decodeBase64(base64Data);
        if (window.TextDecoder) {
          return new TextDecoder('utf-8').decode(bytes);
        }
        var text = '';
        for (var i = 0; i < bytes.length; i += 1) {
          text += String.fromCharCode(bytes[i]);
        }
        return decodeURIComponent(escape(text));
      }

      function focusTerminal() {
        terminal.focus();
        console.debug('xterm.focus');
      }

      function setStatus(message) {
        statusElement.textContent = message;
        statusElement.className = '';
      }

      function hideStatus() {
        statusElement.className = 'hidden';
      }

      if (fitAddon) {
        terminal.loadAddon(fitAddon);
      }

      terminal.open(terminalElement);
      terminalElement.addEventListener('click', focusTerminal);
      terminalElement.addEventListener('touchstart', focusTerminal, { passive: true });
      terminal.onData(function (data) {
        console.debug('xterm.input chars=' + data.length);
        callBridge('input', data);
      });

      terminalElement.addEventListener('paste', function (event) {
        var data = event.clipboardData ? event.clipboardData.getData('text/plain') : '';
        if (!data) return;
        event.preventDefault();
        callBridge('paste', data);
      });

      window.RostrumXterm = {
        fit: fit,
        focus: focusTerminal,
        write: function (base64Data) {
          var text = decodeBase64Text(base64Data);
          console.debug('xterm.write chars=' + text.length);
          if (terminal.rows >= minimumRows) {
            hideStatus();
          } else {
            setStatus('Terminal output received; waiting for layout...');
          }
          terminal.write(text);
        }
      };

      if (window.ResizeObserver) {
        var observer = new ResizeObserver(function () {
          scheduleFit();
        });
        observer.observe(terminalElement);
      } else {
        window.addEventListener('resize', scheduleFit);
      }

      fit();
      terminal.focus();
      setStatus('Waiting for terminal output...');
      console.debug('xterm.ready');
      callBridge('ready');
    }());
  </script>
</body>
</html>
