<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎使用万灵驭手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }
        
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
        }
        
        .highlight-box {
            background: linear-gradient(135deg, #667eea20, #764ba220);
            border-radius: 16px;
            padding: 20px;
            margin: 24px 0;
            border-left: 4px solid #667eea;
        }
        
        .highlight-box h3 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .highlight-box p {
            color: #555;
            line-height: 1.6;
        }
        
        .features {
            margin: 24px 0;
        }
        
        .feature {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }
        
        .feature:last-child {
            border-bottom: none;
        }
        
        .feature-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        
        .feature-content h4 {
            font-size: 16px;
            color: #333;
            margin-bottom: 4px;
        }
        
        .feature-content p {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        
        .tips {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin: 24px 0;
        }
        
        .tips h4 {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 12px;
        }
        
        .tips ul {
            list-style: none;
            padding: 0;
        }
        
        .tips li {
            font-size: 13px;
            color: #666;
            padding: 6px 0;
            padding-left: 20px;
            position: relative;
        }
        
        .tips li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
        }
        
        .cta {
            text-align: center;
            margin-top: 32px;
            padding: 24px;
            background: linear-gradient(135deg, #667eea10, #764ba210);
            border-radius: 16px;
        }
        
        .cta-icon {
            font-size: 48px;
            margin-bottom: 12px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .cta h3 {
            font-size: 20px;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .cta p {
            font-size: 14px;
            color: #666;
        }
        
        .ball-hint {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            margin-top: 16px;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
            }
            50% {
                box-shadow: 0 4px 24px rgba(102, 126, 234, 0.6);
            }
            100% {
                box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🌐</div>
            <h1>万灵驭手</h1>
            <p class="subtitle">你的智能文件管理伙伴</p>
        </div>
        
        <div class="highlight-box">
            <h3>👋 首次使用？</h3>
            <p>欢迎来到万灵驭手！这是一款创新的三窗口文件管理器，让你同时浏览、预览、编辑文件，效率翻倍。</p>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📁</div>
                <div class="feature-content">
                    <h4>智能文件浏览</h4>
                    <p>三窗口布局，轻松管理文件。左上浏览，右上预览，底部多功能。</p>
                </div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">🖥️</div>
                <div class="feature-content">
                    <h4>远程终端</h4>
                    <p>连接主机、浏览远程目录，并通过终端完成维护操作。</p>
                </div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">👁️</div>
                <div class="feature-content">
                    <h4>实时预览</h4>
                    <p>支持图片、文档、代码、网页等多种格式的即时预览。</p>
                </div>
            </div>
        </div>
        
        <div class="tips">
            <h4>💡 操作小技巧</h4>
            <ul>
                <li>双指缩放可以调整文件图标大小</li>
                <li>长按文件可以拖拽到其他窗口</li>
                <li>点击小球打开功能切换菜单</li>
            </ul>
        </div>
        
        <div class="cta">
            <div class="cta-icon">⚪</div>
            <h3>准备好了吗？</h3>
            <p>屏幕中央有一个控制小球</p>
            <div class="ball-hint">👆 拖动小球，探索新世界</div>
        </div>
    </div>
</body>
</html>
